<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Controle de Ferramentas</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<style>
:root{
  --bg:#f3f6fb;--card:#fff;--text:#172033;--muted:#667085;
  --primary:#1769e0;--primary2:#0f56c7;--primarySoft:#eaf2ff;
  --danger:#dc2626;--ok:#16a34a;--warn:#d97706;--border:#e6eaf0;
  --shadow:0 10px 30px rgba(16,24,40,.07);--shadow2:0 20px 60px rgba(16,24,40,.12);
  --radius:18px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{min-height:100vh}
.top{
  height:72px;background:rgba(255,255,255,.94);color:var(--text);
  display:flex;align-items:center;justify-content:space-between;padding:0 24px;
  position:sticky;top:0;z-index:30;border-bottom:1px solid var(--border);
  backdrop-filter:blur(12px)
}
.brand{font-weight:850;display:flex;gap:12px;align-items:center;letter-spacing:-.2px}
.brand span{
  width:42px;height:42px;display:grid;place-items:center;background:linear-gradient(135deg,#1769e0,#4f8df5);
  color:#fff;padding:0;border-radius:13px;box-shadow:0 8px 18px rgba(23,105,224,.22)
}
.userbar{display:flex;gap:10px;align-items:center;font-size:13px}
.userbar #currentUser{font-weight:750}
.role{background:var(--primarySoft);color:#1454b8;padding:7px 11px;border-radius:999px;font-weight:750}
.layout{display:flex;max-width:1500px;margin:auto;min-height:calc(100vh - 72px)}
.side{
  width:245px;padding:22px 16px;position:sticky;top:72px;height:calc(100vh - 72px);
  border-right:1px solid var(--border);background:#fff
}
.nav{display:flex;flex-direction:column;gap:6px}
.nav button{
  width:100%;border:0;background:transparent;text-align:left;padding:12px 14px;border-radius:12px;
  margin:0;color:#475467;font-weight:650;transition:.18s
}
.nav button.active{background:var(--primarySoft);color:#1454b8;box-shadow:inset 3px 0 0 var(--primary)}
.nav button:hover{background:#f5f8fc;color:#1454b8;transform:translateX(2px)}
.content{padding:28px 30px 45px;width:100%;min-width:0}
.view{display:none}.view.active{display:block;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.title{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}
.title h1{font-size:28px;letter-spacing:-.6px;margin:0}
.title p{color:var(--muted);margin:6px 0 0;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:19px;box-shadow:var(--shadow)
}
.metric{font-size:30px;font-weight:850;margin-top:7px;letter-spacing:-1px}
.label{color:var(--muted);font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.35px}
.panel{margin-top:18px}
.tablewrap{
  overflow:auto;background:#fff;border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow)
}
.table{width:100%;border-collapse:separate;border-spacing:0;min-width:760px}
.table th,.table td{padding:14px 15px;border-bottom:1px solid #edf0f4;text-align:left;font-size:13px}
.table th{background:#f8fafc;color:#667085;font-size:11px;text-transform:uppercase;letter-spacing:.45px;position:sticky;top:0}
.table tr:last-child td{border-bottom:0}
.table tbody tr:hover{background:#fafcff}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  border:0;border-radius:11px;padding:10px 14px;background:#eef1f5;color:#172033;font-weight:750;
  transition:.18s;box-shadow:0 1px 1px rgba(16,24,40,.03)
}
.btn:hover{transform:translateY(-1px);filter:brightness(.98)}
.btn.primary{background:linear-gradient(135deg,var(--primary),#3d82ec);color:#fff;box-shadow:0 7px 16px rgba(23,105,224,.18)}
.btn.primary:hover{background:linear-gradient(135deg,var(--primary2),#3477df)}
.btn.danger{background:#fff0f0;color:#b42318}.btn.ok{background:#ecfdf3;color:#087443}.btn.warn{background:#fff8e8;color:#a15c00}
.btn.small{padding:7px 10px;font-size:12px;border-radius:9px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:800}
.available,.approved{background:#ecfdf3;color:#087443}.loaned,.pending{background:#fff8e8;color:#a15c00}
.maintenance{background:#fff8e8;color:#a15c00}.rejected{background:#fff0f0;color:#b42318}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.field label{display:block;font-size:12px;font-weight:750;margin-bottom:6px;color:#344054}
.field input,.field select,.field textarea{
  width:100%;border:1px solid #d8dee8;border-radius:11px;padding:11px 12px;background:#fff;
  outline:none;transition:.18s;color:var(--text)
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:#76a8f3;box-shadow:0 0 0 4px rgba(23,105,224,.10)
}
.field textarea{min-height:95px;resize:vertical}.full{grid-column:1/-1}
.search{max-width:420px}.empty{text-align:center;padding:38px;color:var(--muted)}
.mobile-nav{display:none}
.toast{
  position:fixed;right:22px;bottom:22px;background:#172033;color:#fff;padding:13px 17px;border-radius:12px;
  box-shadow:var(--shadow2);z-index:100;display:none;font-weight:650
}
.login{
  min-height:100vh;display:grid;place-items:center;padding:24px;
  background:
    radial-gradient(circle at 10% 10%,rgba(255,255,255,.18),transparent 32%),
    radial-gradient(circle at 90% 90%,rgba(255,255,255,.14),transparent 30%),
    linear-gradient(135deg,#0d1b33,#1769e0 58%,#2d7af0)
}
.loginbox{
  width:min(440px,100%);background:rgba(255,255,255,.98);padding:34px;border-radius:24px;
  box-shadow:0 30px 90px rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.55)
}
.loginbox h1{margin:0 0 7px;font-size:27px;letter-spacing:-.7px}
.loginbox p{color:var(--muted);font-size:14px;margin:0 0 20px;line-height:1.5}
.loginbox .field{margin-top:13px}
.loginbox .btn.primary{height:46px;font-size:14px}
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.58);z-index:50;place-items:center;padding:18px;backdrop-filter:blur(3px)}
.modal.show{display:grid}
.modalbox{
  background:#fff;border-radius:20px;width:min(700px,100%);max-height:90vh;overflow:auto;
  padding:24px;box-shadow:var(--shadow2);border:1px solid #edf0f4
}
.modalhead{display:flex;justify-content:space-between;align-items:center;gap:15px}
.modalhead h2{margin:0 0 18px;font-size:20px;letter-spacing:-.3px}
.close{border:0;background:#f2f4f7;border-radius:10px;width:36px;height:36px;color:#475467;font-weight:800}
.close:hover{background:#e9edf2}
.dangerText{color:#b42318}
@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.side{width:215px}.content{padding:22px}}
@media(max-width:850px){
  .side{display:none}.content{padding:17px 14px 88px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .mobile-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);
    border-top:1px solid var(--border);z-index:40;justify-content:space-around;padding:8px 4px;
    backdrop-filter:blur(10px)
  }
  .mobile-nav button{border:0;background:none;color:#667085;font-size:10px;padding:6px 4px;border-radius:9px;font-weight:650}
  .mobile-nav button.active{color:#1454b8;background:var(--primarySoft);font-weight:850}
  .formgrid{grid-template-columns:1fr}.full{grid-column:auto}
  .title{align-items:flex-start;flex-direction:column}.title h1{font-size:23px}
  .title .btn{width:100%}.userbar #currentUser{display:none}.userbar .role{display:none}
  .top{height:64px;padding:0 12px}.side{top:64px;height:calc(100vh - 64px)}
}
@media(max-width:450px){
  .grid{grid-template-columns:1fr 1fr}.metric{font-size:24px}
  .card{padding:15px}.brand{font-size:13px}.brand span{width:36px;height:36px;border-radius:11px}
  .loginbox{padding:25px 20px;border-radius:20px}.loginbox h1{font-size:23px}
}
</style>
</head>
<body>
<div id="login" class="login">
  <div class="loginbox">
    <div style="width:58px;height:58px;border-radius:16px;background:linear-gradient(135deg,#1769e0,#4f8df5);display:grid;place-items:center;font-size:30px;color:#fff;box-shadow:0 12px 25px rgba(23,105,224,.2);margin-bottom:16px">🛠️</div><h1>Controle de Ferramentas</h1>
    <p>Gestão completa de ferramentas, empréstimos, devoluções e solicitações.</p><div style="margin:12px 0;padding:10px;border-radius:10px;background:#eff6ff;color:#1d4ed8;text-align:center;font-size:12px;font-weight:800">✨ Desenvolvido por Lerranderson souza</div>
    <div class="field"><label>Usuário</label><input id="loginUser" placeholder="Digite seu usuário"></div>
    <div class="field" style="margin-top:10px"><label>Senha</label><input id="loginPass" type="password" placeholder="Digite sua senha"></div>
    <button class="btn primary" style="width:100%;margin-top:14px" onclick="login()">Entrar</button>
  </div>
</div>

<div id="app" class="app" style="display:none">
<header class="top"><div class="brand"><span>🛠️</span><div><div>Controle de Ferramentas</div><small style="display:block;color:#98a2b3;font-size:10px;font-weight:650;margin-top:1px">Almoxarifado • Gestão de ferramentas</small></div></div><div class="userbar"><button id="profileBtn" class="btn small" onclick="profileModal()" title="Perfil">👤</button><span id="currentUser"></span><span id="currentRole" class="role"></span><button class="btn small" onclick="logout()">Sair</button></div></header>
<div class="layout">
<aside class="side"><nav id="sideNav" class="nav"></nav></aside>
<main class="content"><div style="text-align:center;color:#98a2b3;font-size:11px;margin-bottom:18px">Desenvolvido por <b style="color:#667085">Lerranderson Souza</b> • Controle de Ferramentas</div>
<section id="dashboard" class="view active"></section>
<section id="tools" class="view"></section>
<section id="requests" class="view"></section>
<section id="returns" class="view"></section>
<section id="history" class="view"></section>
<section id="reports" class="view"></section>
<section id="users" class="view"></section>
</main></div>
<nav id="mobileNav" class="mobile-nav"></nav>
</div>

<div id="modal" class="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle"></h2><button class="close" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast"></div>

<script>
const firebaseConfig={apiKey:"AIzaSyDAFYpDlMYBufHr4ztIxdgEt1eGMkYn1XQ",authDomain:"sistemaepi-689f8.firebaseapp.com",projectId:"sistemaepi-689f8",storageBucket:"sistemaepi-689f8.firebasestorage.app",messagingSenderId:"379284547008",appId:"1:379284547008:web:7966ad0c623fc1c2c5d425"};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
const COL={users:'usuarios',tools:'ferramentas',requests:'solicitacoes',history:'historico',logs:'logs'};
const legacyUsers={lerranderson:{name:'Lerranderson',role:'Almoxarifado',password:'1234'},eliomar:{name:'Eliomar Lucas Fortunato',role:'Analista de Medição',password:'1234'},fabio:{name:'Fabio Ribeiro Assis Nascimento Menezes',role:'Encarregado',password:'1234'},adriano:{name:'Adriano Jose Mártir',role:'Encarregado',password:'1234'},edmilson:{name:'Edmilson Borges de Araújo',role:'Encarregado',password:'1234'},josegomes:{name:'Jose Gomes da Costa',role:'Encarregado',password:'1234'},valdemir:{name:'Valdemir de Carvalho',role:'Encarregado',password:'1234'}};
let state={tools:[],requests:[],history:[],users:[]},current=null,view='dashboard',unsubs=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const now=()=>new Date().toLocaleString('pt-BR');
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>x.style.display='none',2800)}
async function hashPassword(p){const data=new TextEncoder().encode(p),buf=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('')}
async function logAction(acao){if(!current)return;try{await db.collection(COL.logs).add({usuario:current.user,nome:current.name,perfil:current.role,acao,data:now(),timestamp:firebase.firestore.FieldValue.serverTimestamp()})}catch(e){console.error(e)}}
function isAlmox(){return current?.role==='Almoxarifado'}
function isManager(){return ['Almoxarifado','Analista de Medição'].includes(current?.role)}
async function login(){let u=document.getElementById('loginUser').value.trim().toLowerCase(),p=document.getElementById('loginPass').value;if(!u||!p)return toast('Informe usuário e senha.');try{let snap=await db.collection(COL.users).where('username','==',u).limit(1).get();if(snap.empty)return toast('Usuário ou senha inválidos.');let d=snap.docs[0],uData={id:d.id,...d.data()};if(uData.active===false)return toast('Este usuário está desativado.');let h=await hashPassword(p);if(uData.passwordHash!==h)return toast('Usuário ou senha inválidos.');current={user:uData.username,name:uData.name,role:uData.role,photo:uData.photo||'',id:d.id};sessionStorage.setItem('cf_user',JSON.stringify(current));await logAction('Entrou no sistema');start()}catch(e){console.error(e);toast('Erro ao conectar ao Firebase.')}}
function logout(){logAction('Saiu do sistema');unsubs.forEach(u=>u&&u());unsubs=[];sessionStorage.removeItem('cf_user');location.reload()}
async function seedUsers(){let snap=await db.collection(COL.users).limit(1).get();if(!snap.empty)return;let batch=db.batch();for(const [username,u] of Object.entries(legacyUsers)){let ref=db.collection(COL.users).doc();batch.set(ref,{username,name:u.name,role:u.role,passwordHash:await hashPassword(u.password),active:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()})}await batch.commit()}
async function migrateLegacy(){let raw=localStorage.getItem('controleFerramentas_v1');if(!raw||localStorage.getItem('cf_migrated_v1'))return;try{let old=JSON.parse(raw),toolSnap=await db.collection(COL.tools).limit(1).get();if(toolSnap.empty&&old.tools?.length){let b=db.batch();old.tools.forEach(t=>{let ref=db.collection(COL.tools).doc(String(t.id));b.set(ref,{...t,createdAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})});await b.commit()}let reqSnap=await db.collection(COL.requests).limit(1).get();if(reqSnap.empty&&old.requests?.length){let b=db.batch();old.requests.forEach(r=>{let ref=db.collection(COL.requests).doc(String(r.id));b.set(ref,{...r,createdAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})});await b.commit()}let histSnap=await db.collection(COL.history).limit(1).get();if(histSnap.empty&&old.history?.length){let b=db.batch();old.history.forEach((h,i)=>b.set(db.collection(COL.history).doc(String(Date.now()+i)),{...h,createdAt:firebase.firestore.FieldValue.serverTimestamp()}));await b.commit()}localStorage.setItem('cf_migrated_v1','1');toast('Dados antigos migrados para o Firebase.')}catch(e){console.error('migração',e)}}
async function start(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';document.getElementById('currentUser').textContent=current.name;document.getElementById('currentRole').textContent=current.role;buildNav();setupListeners();render()}
function navItems(){let a=[['dashboard','📊','Dashboard'],['tools','🔧','Ferramentas'],['requests','📋','Solicitações'],['returns','↩️','Devoluções']];if(isManager())a.push(['history','🕘','Histórico'],['reports','📈','Relatórios']);if(isAlmox())a.push(['users','👥','Usuários']);return a}
function buildNav(){let n=navItems(),html=n.map(x=>`<button class="${view===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]} ${x[2]}</button>`).join('');document.getElementById('sideNav').innerHTML=html;document.getElementById('mobileNav').innerHTML=n.slice(0,5).map(x=>`<button class="${view===x[0]?'active':''}" onclick="go('${x[0]}')"><div>${x[1]}</div>${x[2]}</button>`).join('')}
function go(v){if(v==='users'&&!isAlmox())return;view=v;buildNav();document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(v).classList.add('active');render()}
function render(){if(view==='dashboard')dashboard();if(view==='tools')tools();if(view==='requests')requests();if(view==='returns')returns();if(view==='history')history();if(view==='reports')reports();if(view==='users')usersView()}
function setupListeners(){unsubs.push(db.collection(COL.tools).onSnapshot(s=>{state.tools=s.docs.map(d=>({id:d.id,...d.data()}));render()}));unsubs.push(db.collection(COL.requests).onSnapshot(s=>{state.requests=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));render()}));unsubs.push(db.collection(COL.history).orderBy('createdAt','desc').limit(500).onSnapshot(s=>{state.history=s.docs.map(d=>({id:d.id,...d.data()}));render()}));unsubs.push(db.collection(COL.users).orderBy('name').onSnapshot(s=>{state.users=s.docs.map(d=>({id:d.id,...d.data()}));if(current){let me=state.users.find(u=>String(u.id)===String(current.id));if(me){current.name=me.name;current.role=me.role;current.photo=me.photo||'';sessionStorage.setItem('cf_user',JSON.stringify(current));document.getElementById('currentUser').textContent=current.name;document.getElementById('currentRole').textContent=current.role;updateProfileUI()}render()}}))}
function dashboard(){let total=state.tools.reduce((a,t)=>a+(+t.qty||0),0),avail=state.tools.reduce((a,t)=>a+(+t.available||0),0),loan=total-avail,pending=state.requests.filter(r=>r.status==='Pendente').length;document.getElementById('dashboard').innerHTML=`<div class="title"><div><h1>Seja bem-vindo(a), ${esc(current.name.split(' ')[0])}! 👋</h1><p>Gestão de estoque, empréstimos, devoluções e solicitações.</p></div><button class="btn primary" onclick="go('requests')">+ Nova solicitação</button></div><div class="grid"><div class="card"><div class="label">Total de unidades</div><div class="metric">${total}</div></div><div class="card"><div class="label">Disponíveis</div><div class="metric">${avail}</div></div><div class="card"><div class="label">Emprestadas</div><div class="metric">${loan}</div></div><div class="card"><div class="label">Pendentes</div><div class="metric">${pending}</div></div></div><div class="panel card"><h3>Ferramentas</h3>${state.tools.slice(0,8).map(t=>`<div style="display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border)"><span><b>${esc(t.name)}</b><br><small>${esc(t.code||'-')} · ${esc(t.cat||'-')}</small></span><span><b>${+t.available||0}/${+t.qty||0}</b> disponíveis</span></div>`).join('')||'<div class="empty">Nenhuma ferramenta cadastrada.</div>'}</div>`}
function tools(){let canEdit=isAlmox();document.getElementById('tools').innerHTML=`<div class="title"><div><h1>Ferramentas</h1><p>Controle das ferramentas cadastradas.</p></div>${canEdit?'<button class="btn primary" onclick="toolModal()">+ Cadastrar</button>':''}</div><div class="actions"><input id="toolSearch" class="field input search" style="padding:10px;border:1px solid var(--border);border-radius:10px" placeholder="🔎 Buscar ferramenta..." oninput="filterTools()"></div><div class="panel tablewrap"><table class="table"><thead><tr><th>Ferramenta</th><th>Código</th><th>Categoria</th><th>Estoque</th><th>Disponível</th><th>Status</th><th>Ações</th></tr></thead><tbody id="toolRows"></tbody></table></div>`;filterTools()}
function filterTools(){let q=(document.getElementById('toolSearch')?.value||'').toLowerCase(),rows=state.tools.filter(t=>(t.name+' '+(t.code||'')+' '+(t.cat||'')).toLowerCase().includes(q)).map(t=>`<tr><td><b>${esc(t.name)}</b></td><td>${esc(t.code||'-')}</td><td>${esc(t.cat||'-')}</td><td>${+t.qty||0}</td><td>${+t.available||0}</td><td><span class="badge ${+t.available===0?'loaned':t.status==='Manutenção'?'maintenance':'available'}">${esc(+t.available===0?'Emprestada':t.status||'Disponível')}</span></td><td class="actions">${isAlmox()?`<button class="btn small" onclick="toolModal('${t.id}')">Editar</button><button class="btn small danger" onclick="deleteTool('${t.id}')">Excluir</button>`:'-'}</td></tr>`).join('');document.getElementById('toolRows').innerHTML=rows||'<tr><td colspan="7" class="empty">Nenhuma ferramenta encontrada.</td></tr>'}
function toolModal(id){let t=state.tools.find(x=>String(x.id)===String(id))||{name:'',code:'',cat:'',qty:1,available:1,status:'Disponível'};openModal(id?'Editar ferramenta':'Cadastrar ferramenta',`<div class="formgrid"><div class="field"><label>Nome</label><input id="fName" value="${esc(t.name)}"></div><div class="field"><label>Código / patrimônio</label><input id="fCode" value="${esc(t.code||'')}"></div><div class="field"><label>Categoria</label><input id="fCat" value="${esc(t.cat||'')}"></div><div class="field"><label>Quantidade</label><input id="fQty" type="number" min="1" value="${+t.qty||1}"></div><div class="field"><label>Disponíveis</label><input id="fAvail" type="number" min="0" value="${+t.available||0}"></div><div class="field"><label>Status</label><select id="fStatus"><option ${t.status==='Disponível'?'selected':''}>Disponível</option><option ${t.status==='Manutenção'?'selected':''}>Manutenção</option></select></div></div><div class="actions" style="margin-top:16px"><button class="btn primary" onclick="saveTool('${id||''}')">Salvar</button><button class="btn" onclick="closeModal()">Cancelar</button></div>`)}
async function saveTool(id){if(!isAlmox())return toast('Somente o Almoxarifado pode alterar ferramentas.');let name=fName.value.trim(),code=fCode.value.trim(),cat=fCat.value.trim(),qty=+fQty.value,available=+fAvail.value;if(!name||!code||!qty||available<0||available>qty)return toast('Preencha os dados corretamente.');try{let data={name,code,cat,qty,available,status:fStatus.value,updatedAt:firebase.firestore.FieldValue.serverTimestamp()};if(id)await db.collection(COL.tools).doc(id).update(data);else await db.collection(COL.tools).add({...data,createdAt:firebase.firestore.FieldValue.serverTimestamp()});await logAction((id?'Editou':'Cadastrou')+' a ferramenta '+name);closeModal();toast('Ferramenta salva.')}catch(e){console.error(e);toast('Não foi possível salvar a ferramenta.')}}
async function deleteTool(id){if(!isAlmox())return;if(!confirm('Excluir esta ferramenta?'))return;try{await db.collection(COL.tools).doc(id).delete();await logAction('Excluiu uma ferramenta');toast('Ferramenta excluída.')}catch(e){toast('Erro ao excluir ferramenta.')}}
function requests(){let mine=isAlmox()?state.requests:state.requests.filter(r=>r.usuario===current.user);document.getElementById('requests').innerHTML=`<div class="title"><div><h1>Solicitações</h1><p>Pedidos de retirada de ferramentas.</p></div><button class="btn primary" onclick="requestModal()">+ Nova solicitação</button></div><div class="panel tablewrap"><table class="table"><thead><tr><th>Data/Hora</th><th>Solicitante</th><th>Obra</th><th>Retirada por</th><th>Ferramenta</th><th>Qtd.</th><th>Observação</th><th>Status</th><th>Ações</th></tr></thead><tbody>${mine.map(r=>{let t=state.tools.find(x=>String(x.id)===String(r.toolId));return `<tr><td>${esc(r.date||'-')}</td><td>${esc(r.person)}</td><td>${esc(r.obra||'-')}</td><td>${esc(r.retirante||'-')}</td><td>${esc(r.manualItem||t?.name||'Excluída')}</td><td>${r.qty}</td><td>${esc(r.note||'-')}</td><td><span class="badge ${r.status==='Pendente'?'pending':r.status==='Aprovada'?'approved':'rejected'}">${esc(r.status)}</span></td><td class="actions">${isAlmox()&&r.status==='Pendente'?`<button class="btn small ok" onclick="approve('${r.id}')">Aprovar</button><button class="btn small danger" onclick="reject('${r.id}')">Rejeitar</button>`:'-'}</td></tr>`}).join('')||'<tr><td colspan="9" class="empty">Nenhuma solicitação.</td></tr>'}</tbody></table></div>`}
function requestModal(){let opts=state.tools.filter(t=>(+t.available||0)>0).map(t=>`<option value="${t.id}">${esc(t.name)} — ${+t.available} disponível(is)</option>`).join('');openModal('Nova solicitação',`<div class="formgrid"><div class="field"><label>Encarregado solicitante</label><input id="rPerson" value="${esc(current.name)}" readonly></div><div class="field"><label>Obra</label><input id="rObra" placeholder="Nome ou código da obra"></div><div class="field"><label>Colaborador que vai retirar</label><input id="rRetirante" placeholder="Nome do colaborador"></div><div class="field"><label>Ferramenta cadastrada</label><select id="rTool">${opts||'<option value="">Nenhuma disponível</option>'}</select></div><div class="field full"><label>Não encontrou o item?</label><input id="rManual" placeholder="Digite o nome do item manualmente"></div><div class="field"><label>Quantidade</label><input id="rQty" type="number" min="1" value="1"></div><div class="field"><label>Observação</label><input id="rNote" placeholder="Serviço ou observação..."></div></div><div class="actions" style="margin-top:16px"><button class="btn primary" onclick="saveRequest()">Enviar solicitação</button></div>`)}
async function saveRequest(){let manual=rManual.value.trim(),toolId=manual?null:rTool.value,qty=+rQty.value,t=toolId?state.tools.find(x=>String(x.id)===String(toolId)):null,obra=rObra.value.trim(),retirante=rRetirante.value.trim();if(qty<1)return toast('Quantidade inválida.');if(!manual&&(!t||qty>+t.available))return toast('Quantidade indisponível.');if(!obra||!retirante)return toast('Informe a obra e o colaborador que vai retirar.');try{await db.collection(COL.requests).add({date:now(),person:current.name,usuario:current.user,obra,retirante,toolId,manualItem:manual,qty,note:rNote.value.trim(),status:'Pendente',createdAt:firebase.firestore.FieldValue.serverTimestamp()});await logAction('Criou solicitação de ferramenta para '+retirante);closeModal();toast('Solicitação enviada.')}catch(e){console.error(e);toast('Erro ao enviar solicitação.')}}
async function approve(id){if(!isAlmox())return;let r=state.requests.find(x=>String(x.id)===String(id)),t=state.tools.find(x=>String(x.id)===String(r?.toolId));if(!r)return;if(!t||+t.available<+r.qty)return toast('Estoque insuficiente.');try{await db.runTransaction(async tx=>{let tr=db.collection(COL.tools).doc(t.id),rr=db.collection(COL.requests).doc(r.id),snap=await tx.get(tr),d=snap.data()||{};if(+d.available<+r.qty)throw new Error('ESTOQUE');let av=+d.available-+r.qty;tx.update(tr,{available:av,status:av?'Disponível':'Emprestada',updatedAt:firebase.firestore.FieldValue.serverTimestamp()});tx.update(rr,{status:'Aprovada',approvedBy:current.name,approvedAt:now()});tx.set(db.collection(COL.history).doc(),{date:now(),type:'Saída',person:r.person,obra:r.obra,retirante:r.retirante,tool:d.name,qty:+r.qty,by:current.name,condition:'Em empréstimo',createdAt:firebase.firestore.FieldValue.serverTimestamp()})});await logAction('Aprovou solicitação de '+r.person);toast('Solicitação aprovada e saída registrada.')}catch(e){console.error(e);toast(e.message==='ESTOQUE'?'Estoque insuficiente.':'Erro ao aprovar solicitação.')}}
function reject(id){if(!isAlmox())return;openModal('Rejeitar solicitação',`<p>O motivo da recusa é obrigatório.</p><div class="field"><label>Motivo da recusa *</label><textarea id="rejectReason" placeholder="Digite o motivo..."></textarea></div><div class="actions" style="margin-top:16px"><button class="btn danger" onclick="confirmReject('${id}')">Confirmar rejeição</button><button class="btn" onclick="closeModal()">Cancelar</button></div>`)}
async function confirmReject(id){let reason=document.getElementById('rejectReason')?.value.trim();if(!reason)return toast('O motivo da recusa é obrigatório.');let r=state.requests.find(x=>String(x.id)===String(id));if(!r)return;try{await db.collection(COL.requests).doc(id).update({status:'Rejeitada',rejectReason:reason,rejectedBy:current.name,rejectedAt:now()});await logAction('Rejeitou solicitação de '+r.person);closeModal();toast('Solicitação rejeitada.')}catch(e){console.error(e);toast('Erro ao rejeitar solicitação.')}}
function returns(){let loans=state.requests.filter(r=>r.status==='Aprovada'&&+r.qty>0&&r.toolId);document.getElementById('returns').innerHTML=`<div class="title"><div><h1>Devoluções</h1><p>Registre o retorno das ferramentas emprestadas.</p></div></div><div class="panel tablewrap"><table class="table"><thead><tr><th>Solicitante</th><th>Ferramenta</th><th>Qtd. emprestada</th><th>Data</th><th>Ação</th></tr></thead><tbody>${loans.map(r=>{let t=state.tools.find(x=>String(x.id)===String(r.toolId));return `<tr><td>${esc(r.person)}</td><td>${esc(t?.name||'')}</td><td>${r.qty}</td><td>${esc(r.date||'-')}</td><td><button class="btn small ok" onclick="returnModal('${r.id}')">Registrar devolução</button></td></tr>`}).join('')||'<tr><td colspan="5" class="empty">Nenhuma ferramenta emprestada.</td></tr>'}</tbody></table></div>`}
function returnModal(id){let r=state.requests.find(x=>String(x.id)===String(id)),t=state.tools.find(x=>String(x.id)===String(r?.toolId));if(!r||!t)return;openModal('Registrar devolução',`<p><b>${esc(t.name)}</b> — ${r.qty} unidade(s) com <b>${esc(r.person)}</b>.</p><div class="field"><label>Quantidade devolvida</label><input id="dQty" type="number" min="1" max="${r.qty}" value="${r.qty}"></div><div class="field" style="margin-top:10px"><label>Condição</label><select id="dCondition"><option>Boa</option><option>Com avaria</option><option>Manutenção</option></select></div><div class="actions" style="margin-top:16px"><button class="btn primary" onclick="saveReturn('${r.id}')">Confirmar devolução</button></div>`)}
async function saveReturn(id){if(!isAlmox())return;let r=state.requests.find(x=>String(x.id)===String(id)),t=state.tools.find(x=>String(x.id)===String(r?.toolId)),q=+dQty.value;if(!r||!t||q<1||q>+r.qty)return toast('Quantidade inválida.');try{await db.runTransaction(async tx=>{let tr=db.collection(COL.tools).doc(t.id),rr=db.collection(COL.requests).doc(r.id),snap=await tx.get(tr),d=snap.data()||{},newQty=+r.qty-q,av=+d.available+q;tx.update(tr,{available:av,status:dCondition.value==='Manutenção'?'Manutenção':av?'Disponível':'Emprestada',updatedAt:firebase.firestore.FieldValue.serverTimestamp()});tx.update(rr,{qty:newQty,status:newQty===0?'Devolvida':'Aprovada',lastReturn:now()});tx.set(db.collection(COL.history).doc(),{date:now(),type:'Devolução',person:r.person,obra:r.obra,retirante:r.retirante,tool:d.name,qty:q,by:current.name,condition:dCondition.value,createdAt:firebase.firestore.FieldValue.serverTimestamp()})});await logAction('Registrou devolução de '+t.name);closeModal();toast('Devolução registrada.')}catch(e){console.error(e);toast('Erro ao registrar devolução.')}}
function history(){if(!isManager()){go('dashboard');return}document.getElementById('history').innerHTML=`<div class="title"><div><h1>Histórico</h1><p>Movimentações registradas no Firebase.</p></div><button class="btn" onclick="exportCSV()">Exportar CSV</button></div><div class="panel tablewrap"><table class="table"><thead><tr><th>Data</th><th>Tipo</th><th>Solicitante</th><th>Obra</th><th>Retirada por</th><th>Ferramenta</th><th>Qtd.</th><th>Responsável</th><th>Condição</th></tr></thead><tbody>${state.history.map(h=>`<tr><td>${esc(h.date||'-')}</td><td>${esc(h.type||'-')}</td><td>${esc(h.person||'-')}</td><td>${esc(h.obra||'-')}</td><td>${esc(h.retirante||'-')}</td><td>${esc(h.tool||'-')}</td><td>${h.qty||0}</td><td>${esc(h.by||'-')}</td><td>${esc(h.condition||'-')}</td></tr>`).join('')||'<tr><td colspan="9" class="empty">Sem movimentações.</td></tr>'}</tbody></table></div>`}
function reports(){if(!isManager()){go('dashboard');return}let total=state.tools.reduce((a,t)=>a+(+t.qty||0),0),avail=state.tools.reduce((a,t)=>a+(+t.available||0),0),loan=total-avail,maint=state.tools.filter(t=>t.status==='Manutenção').length;document.getElementById('reports').innerHTML=`<div class="title"><div><h1>Relatórios</h1><p>Resumo atual do patrimônio e movimentações.</p></div><button class="btn primary" onclick="exportCSV()">Exportar histórico</button></div><div class="grid"><div class="card"><div class="label">Unidades totais</div><div class="metric">${total}</div></div><div class="card"><div class="label">Disponíveis</div><div class="metric">${avail}</div></div><div class="card"><div class="label">Em circulação</div><div class="metric">${loan}</div></div><div class="card"><div class="label">Itens em manutenção</div><div class="metric">${maint}</div></div></div><div class="panel card"><h3>Por categoria</h3>${Object.entries(state.tools.reduce((a,t)=>(a[t.cat||'Sem categoria']=(a[t.cat||'Sem categoria']||0)+(+t.qty||0),a),{})).map(([c,n])=>`<div style="display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border)"><span>${esc(c)}</span><b>${n}</b></div>`).join('')||'<div class="empty">Sem dados.</div>'}</div>`}
function exportCSV(){let rows=[['Data','Tipo','Solicitante','Obra','Retirada por','Ferramenta','Quantidade','Responsável','Condição'],...state.history.map(h=>[h.date||'',h.type||'',h.person||'',h.obra||'',h.retirante||'',h.tool||'',h.qty||0,h.by||'',h.condition||''])],csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='historico-ferramentas.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function usersView(){if(!isAlmox())return;document.getElementById('users').innerHTML=`<div class="title"><div><h1>Usuários</h1><p>Cadastre e gerencie quem terá acesso ao sistema.</p></div><button class="btn primary" onclick="userModal()">+ Cadastrar pessoa</button></div><div class="panel tablewrap"><table class="table"><thead><tr><th>Nome</th><th>Usuário</th><th>Perfil</th><th>Status</th><th>Ações</th></tr></thead><tbody>${state.users.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.username)}</td><td>${esc(u.role)}</td><td><span class="badge ${u.active===false?'rejected':'approved'}">${u.active===false?'Inativo':'Ativo'}</span></td><td class="actions"><button class="btn small" onclick="userModal('${u.id}')">Editar</button>${u.id!==current.id?`<button class="btn small warn" onclick="toggleUser('${u.id}',${u.active!==false})">${u.active===false?'Ativar':'Desativar'}</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nenhum usuário.</td></tr>'}</tbody></table></div>`}
function userModal(id){let u=state.users.find(x=>x.id===id)||{name:'',username:'',role:'Encarregado',active:true};openModal(id?'Editar usuário':'Cadastrar pessoa',`<div class="formgrid"><div class="field"><label>Nome completo</label><input id="uName" value="${esc(u.name)}"></div><div class="field"><label>Usuário</label><input id="uUsername" value="${esc(u.username)}" ${id?'readonly':''}></div><div class="field"><label>Perfil</label><select id="uRole"><option ${u.role==='Encarregado'?'selected':''}>Encarregado</option><option ${u.role==='Analista de Medição'?'selected':''}>Analista de Medição</option><option ${u.role==='Almoxarifado'?'selected':''}>Almoxarifado</option></select></div><div class="field"><label>${id?'Nova senha (deixe vazio para manter)':'Senha'}</label><input id="uPassword" type="password" placeholder="Digite a senha"></div></div><div class="actions" style="margin-top:16px"><button class="btn primary" onclick="saveUser('${id||''}')">Salvar</button><button class="btn" onclick="closeModal()">Cancelar</button></div>`)}
async function saveUser(id){if(!isAlmox())return;let name=uName.value.trim(),username=uUsername.value.trim().toLowerCase(),role=uRole.value,password=uPassword.value;if(!name||!username)return toast('Informe nome e usuário.');if(!id&&!password)return toast('Informe uma senha.');try{let data={name,role,active:true,updatedAt:firebase.firestore.FieldValue.serverTimestamp()};if(password)data.passwordHash=await hashPassword(password);if(id)await db.collection(COL.users).doc(id).update(data);else{let exists=await db.collection(COL.users).where('username','==',username).limit(1).get();if(!exists.empty)return toast('Este usuário já existe.');await db.collection(COL.users).add({...data,username,createdAt:firebase.firestore.FieldValue.serverTimestamp()})}await logAction((id?'Editou':'Cadastrou')+' usuário '+username);closeModal();toast('Usuário salvo com sucesso.')}catch(e){console.error(e);toast('Erro ao salvar usuário.')}}
async function toggleUser(id,active){if(!isAlmox())return;if(!confirm(active?'Desativar este usuário?':'Ativar este usuário?'))return;try{await db.collection(COL.users).doc(id).update({active:!active,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});await logAction((active?'Desativou':'Ativou')+' um usuário');toast(active?'Usuário desativado.':'Usuário ativado.')}catch(e){toast('Erro ao alterar usuário.')}}
function profileModal(){
let photo=current?.photo||state.users.find(u=>String(u.id)===String(current?.id))?.photo||'';
openModal('Meu perfil',`<div style="text-align:center">
<div id="photoPreview" style="width:96px;height:96px;border-radius:50%;margin:0 auto 12px;overflow:hidden;background:#eff6ff;display:grid;place-items:center;font-size:34px">${photo?`<img src="${photo}" style="width:100%;height:100%;object-fit:cover">`:'👤'}</div>
<p><b>${esc(current.name)}</b><br><small>${esc(current.role)}</small></p>
<div class="field" style="text-align:left"><label>Escolha sua foto de perfil</label><input id="profilePhoto" type="file" accept="image/*" onchange="previewProfile(event)"></div>
<div class="actions" style="margin-top:16px;justify-content:center"><button class="btn primary" onclick="saveProfilePhoto()">Salvar foto</button><button class="btn" onclick="closeModal()">Cancelar</button></div>
</div>`)
}
function previewProfile(e){
let f=e.target.files?.[0];if(!f)return;
if(!f.type.startsWith('image/'))return toast('Selecione uma imagem.');
if(f.size>2*1024*1024)return toast('A foto deve ter no máximo 2 MB.');
let reader=new FileReader();
reader.onload=()=>{
let x=document.getElementById('photoPreview');
if(!x)return;
x.innerHTML=`<img src="${reader.result}" style="width:100%;height:100%;object-fit:cover">`;
x.dataset.src=reader.result;
};
reader.readAsDataURL(f);
}
async function saveProfilePhoto(){
let src=document.getElementById('photoPreview')?.dataset.src;
if(!src)return toast('Selecione uma foto primeiro.');
if(!current?.id)return toast('Usuário não identificado.');
try{
await db.collection(COL.users).doc(current.id).update({photo:src,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
current.photo=src;
sessionStorage.setItem('cf_user',JSON.stringify(current));
updateProfileUI();
closeModal();
toast('Foto de perfil atualizada!');
}catch(e){console.error(e);toast('Não foi possível salvar a foto.')}
}
function updateProfileUI(){
let photo=current?.photo||state.users.find(u=>String(u.id)===String(current?.id))?.photo||'';
let b=document.getElementById('profileBtn');
if(b)b.innerHTML=photo?`<img src="${photo}" style="width:28px;height:28px;border-radius:50%;object-fit:cover;vertical-align:middle">`:'👤';
}
function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
window.onclick=e=>{if(e.target===document.getElementById('modal'))closeModal()}
(async function init(){try{await seedUsers();await migrateLegacy();let saved=sessionStorage.getItem('cf_user');if(saved){current=JSON.parse(saved);let snap=await db.collection(COL.users).doc(current.id).get();if(!snap.exists||snap.data().active===false){sessionStorage.removeItem('cf_user');current=null}}if(current)start()}catch(e){console.error(e);toast('Não foi possível inicializar o Firebase.')}})();
</script>
</body>
</html>
